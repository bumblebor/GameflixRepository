spring.application.name=GameFlix
# DATASOURCE CONFIG
#spring.datasource.url=jdbc:mysql://localhost:3306/gameflix?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
#spring.datasource.username=${USER}
#spring.datasource.password=${PASS}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Is@i@hW@tson2003}
spring.jpa.hibernate.ddl-auto=update

# JPA AND HIBERNATE
# Hibernate automatically determines the appropriate MySQL dialect
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# DEVTOOLS
spring.devtools.livereload.enabled=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE

#AUTHENTICATION
spring:
security:
oauth2:
resourceserver:
jwt:
issuer-uri:localhost:3306/login
gameflix.jwt.secret=${JWT_SECRET}