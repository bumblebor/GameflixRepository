name: Spring Boot CI



on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]



jobs:

  build:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up JDK

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '21'



      - name: Build with Maven

        run: mvn clean package -DskipTests



      - name: Build Docker image

        run: docker build -t gameflix-backend .
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM
        run: syft gameflix-backend -o cyclonedx-json=sbom.cdx.json
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
      - name: Scan and gate
        run: trivy image --severity HIGH,CRITICAL gameflix-backend
      - name: Archive SBOM as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json