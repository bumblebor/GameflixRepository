name: Spring Boot CI



on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]



jobs:

  build:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up JDK

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '21'



      - name: Build with Maven

        run: mvn clean package -DskipTests



      - name: Build Docker image

        run: docker build -t gameflix-backend .

      - name: Install syft
        run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin
      - name: Install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Generate SBOM
        run: syft gameflix-backend:c20df8b -o cyclonedx-json=sbom.cdx.json

      - name: Scan and gate
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 gameflix-backend:c20df8b
