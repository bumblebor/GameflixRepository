name: Spring Boot CI



on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]



jobs:

  build:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up JDK

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '21'



      - name: Build with Maven

        run: mvn clean package -DskipTests



      - name: Build Docker image

        run: docker build -t gameflix-backend .
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM
        run: syft gameflix-app:c20df8b -o cyclonedx-json=sbom.cdx.json
      - name: Scan and gate
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 gameflix-app:c20df8b
      - name: Archive SBOM as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json